[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ber"
version = "0.1.0"
description = "Team Grenuke: Business Entity Resolution (Amazon ML Challenge 2026)"
requires-python = ">=3.11"
# Light core deps only (CI installs these). The full pinned environment is requirements.txt.
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
